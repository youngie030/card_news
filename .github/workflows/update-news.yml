name: Update news

on:
  # 매시간 정각(UTC). 시간 단위 주기라 타임존과 무관하다. [FR-A-01]
  schedule:
    - cron: "0 * * * *"
  # Actions 탭에서 수동 실행. [FR-A-02]
  workflow_dispatch:

# data/news_link.json 커밋에 필요한 최소 권한만 준다. [FR-A-05]
permissions:
  contents: write

# 이전 실행이 아직 푸시 중일 때 겹쳐 돌지 않게 한다. [FR-A-08]
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 수집이 실패하면 여기서 잡이 끝나고 아래 커밋 단계는 돌지 않는다. [FR-A-07]
      - name: Fetch news
        id: fetch
        run: python scripts/fetch_news.py

      - name: Commit and push if changed
        env:
          # 워크플로 표현식을 셸 명령에 직접 박지 않고 환경변수로 넘긴다.
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          # git diff 는 추적되지 않는 파일을 놓치므로 status 로 판정한다. [FR-A-03]
          if [ -z "$(git status --porcelain -- data/news_link.json)" ]; then
            echo "변경 없음 — 커밋을 건너뛴다."
            echo "변경 없음 — 커밋하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # [FR-A-04]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news_link.json
          # [FR-A-06]
          git commit -m "chore(news): update news_link.json (${COUNT} items)"
          git push

          echo "갱신 완료 — ${COUNT}건" >> "$GITHUB_STEP_SUMMARY"
