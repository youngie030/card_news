<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카드뉴스</title>
  <meta name="description" content="키워드별 최신 뉴스를 카드로 모아 보고 원문으로 바로 이동합니다.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f1e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120d" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/style.css">
  <!-- 첫 페인트 전에 테마를 확정해 깜빡임을 막는다. [FR-W-15] -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('card-news-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { /* 저장소 접근이 막힌 환경은 시스템 설정을 따른다 */ }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <h1 class="brand-title">카드뉴스</h1>
        <p class="brand-sub" id="updated">불러오는 중…</p>
      </div>

      <button id="theme-toggle" class="theme-toggle" type="button" data-mode="system"
              aria-label="테마 전환">
        <svg class="icon icon-system" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12.5" rx="2"></rect>
          <path d="M8.5 20h7M12 16.5V20"></path>
        </svg>
        <svg class="icon icon-light" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"></path>
        </svg>
        <svg class="icon icon-dark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.8A8.6 8.6 0 1 1 9.2 3.5a7 7 0 0 0 11.3 11.3z"></path>
        </svg>
      </button>
    </div>

    <div class="wrap controls">
      <div class="chips" id="chips" role="group" aria-label="키워드 필터"></div>
      <div class="search">
        <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M16.5 16.5L21 21"></path>
        </svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="제목·매체 검색" aria-label="제목과 매체명으로 검색">
      </div>
    </div>
  </header>

  <main class="wrap main">
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <p class="status" id="status" role="status">뉴스를 불러오는 중입니다…</p>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="wrap site-footer">
    <p>제목과 링크만 수집하며 본문은 저장하지 않습니다. 각 기사의 저작권은 해당 언론사에 있습니다.</p>
    <p>출처: Google News RSS · 매시간 자동 갱신</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
